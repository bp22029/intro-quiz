<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <!--
      YouTube は 2025年末から、埋め込みプレーヤーが HTTP Referer で自分を名乗ることを
      必須にした。referrer が落ちると全曲がエラー153で再生できなくなる。
      ブラウザ既定も同じ値だが、リバースプロキシ等で no-referrer / same-origin を
      入れられると即死するため、ここで明示して固定する。
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      見出しの書体。読み込めなくても fallback で動くようにしてある
      （tailwind.config.js の fontFamily に日本語のフォールバックを並べてある）。
      会場の回線が細いと本番中に字が入れ替わって見えるので、
      開演前に一度読ませておくこと（RUNBOOK に書いた）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>イントロクイズ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
